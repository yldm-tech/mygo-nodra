name: post-release
on:
  workflow_call:
    inputs:
      version:
        description: Released version such as v0.1.0
        type: string
        required: true
  # Manual re-run for a release whose check failed, e.g. when the proxy was slow.
  workflow_dispatch:
    inputs:
      version:
        description: Released version such as v0.1.0; defaults to the version in .release-please-manifest.json
        type: string
        required: false
permissions:
  contents: read
env:
  MODULE: github.com/yldm-tech/nodra
jobs:
  # Proves the tag is a valid Go module tag that consumers can fetch: listed and downloaded through proxy.golang.org, checksum verified against sum.golang.org.
  verify-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: version
        env:
          RELEASED_VERSION: ${{ inputs.version }}
        run: |
          version=${RELEASED_VERSION:-v$(jq -r '.["."]' .release-please-manifest.json)}
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::no released version (got $version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag $version"
      - name: Resolve through proxy.golang.org
        working-directory: ${{ runner.temp }}
        env:
          GOWORK: "off"
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -modcacherw
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The proxy fetches a new tag on first request; retry for a few minutes in case GitHub has not served it yet.
          for attempt in $(seq 1 20); do
            if go list -m "$MODULE@$VERSION"; then
              go mod download -json "$MODULE@$VERSION"
              exit 0
            fi
            echo "attempt $attempt: $MODULE@$VERSION not resolvable through the proxy yet"
            sleep 15
          done
          echo "::error::$MODULE@$VERSION does not resolve through proxy.golang.org"
          exit 1
      - name: Compile and run an independent published-module consumer
        env:
          GOPROXY: https://proxy.golang.org
          GOWORK: "off"
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/check-consumer.sh "$VERSION"
