name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Optional repository secret holding a PAT or GitHub App token. With it, release PRs trigger CI on their own; without it, the release-prs job starts CI on them.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-prs:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/nodra/go.mod
          cache: false
      - run: .github/scripts/sync-release-prs.sh
        env:
          GH_TOKEN: ${{ github.token }}
          START_PR_CI: ${{ secrets.RELEASE_PLEASE_TOKEN == '' }}

  post-release:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]'
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/post-release.yml
    with:
      path: ${{ matrix.path }}
    secrets: inherit
