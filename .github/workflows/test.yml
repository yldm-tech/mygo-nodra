name: test
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/nodra/go.mod
      - run: go test -race ./packages/nodra/... ./packages/mygo/... ./examples/...
      - run: go vet ./packages/nodra/... ./packages/mygo/... ./examples/...
      - run: CGO_ENABLED=0 go build ./packages/nodra/... ./packages/mygo/... ./examples/...
      - run: CGO_ENABLED=0 GOOS=linux go build ./packages/nodra/... ./packages/mygo/... ./examples/...
      - run: CGO_ENABLED=0 GOOS=windows go build ./packages/nodra/... ./packages/mygo/... ./examples/...
